<!DOCTYPE html>

<head>

    <link href="https://fonts.googleapis.com/css2?family=Rubik:ital,wght@0,300..900;1,300..900&display=swap" rel="stylesheet">

<body>
    <div id="header_container">
        <div id="left_container">
            

        </div>

        <div id="right_container">

            <div class="btn-group">
                <input type="radio" class="btn-check" id="n_slide_container_radio1" autocomplete="off" name="n_slide_container" value="introduzione" checked>

                <input type="radio" class="btn-check" id="n_slide_container_radio2" autocomplete="off" name="n_slide_container" value="storia">

            </div>

            <div class="slide slide_2 introduzione">
                
            </div>
        </div>

        <div class="slide_container storia">
            <div class="slide slide_1 storia">
                <div class="text_container">
                    <h1>L'origine dei Comuni in Italia</h1>
                </div>
            </div>
            <div class="slide slide_2 storia">
                
            </div>
            <div class="slide slide_3 storia">
                
            </div>
        </div>

        <div class="slide_container civica">
            <div class="slide slide_1 civica">

            </div>
            <div class="slide slide_2 civica">
                
            </div>
        </div>

        <div class="slide_container letteratura">
            <div class="slide slide_1 letteratura">

            </div>
            <div class="slide slide_2 letteratura">
                
            </div>
        </div>
    </div>
